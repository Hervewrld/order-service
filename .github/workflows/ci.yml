name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r src/api/requirements.txt -r src/worker/requirements.txt -r tests/requirements.txt
      - run: pytest tests/ -v

  docker-build:
    name: Docker build (api + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t order-service-api:ci .
      - run: docker build -f docker/worker.Dockerfile -t order-service-worker:ci .

  k8s-lint:
    name: Kubernetes manifests + Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize k8s/base > /dev/null
      - uses: azure/setup-helm@v4
      - run: helm lint k8s/helm/order-service

  terraform-fmt:
    name: Terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform/

  terraform-validate:
    name: Terraform validate (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform init -backend=false
          terraform validate
